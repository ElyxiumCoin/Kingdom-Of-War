<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kingdoms of War</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout concept: full-bleed isometric canvas, medieval HUD panels pinned to the four corners (resources top-left, age/speed top-right, build deck bottom-left, minimap bottom-right). */
:root{
  --bg:#0b0f16; --panel:#121923; --panel2:#1a2432; --line:#2b3a50;
  --gold:#e0b85c; --goldD:#8d6b2b; --ink:#ece4d0; --mut:#9ba6b8;
  --blue:#4a7be0; --red:#d24a40; --good:#7ccf62; --warn:#e8ae3e; --bad:#e2574f;
  --fd:'Pixelify Sans','Courier New',monospace; --fb:'Alegreya Sans','Trebuchet MS',Arial,sans-serif;
  --s:1; color-scheme:dark;
}
html,body{overscroll-behavior:none}
#tabbody,#ubody,.cmp #resbar,.modal{overscroll-behavior:contain}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;display:block;cursor:default}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.panel{position:absolute;background:linear-gradient(180deg,#141c28,#0c1119);border:2px solid var(--goldD);border-radius:3px;
  box-shadow:0 0 0 1px #000,inset 0 0 0 2px #090d14,inset 0 0 0 3px rgba(224,184,92,.28),0 8px 22px rgba(0,0,0,.55)}
.fd{font-family:var(--fd);letter-spacing:.02em}
img.px,canvas.px{image-rendering:pixelated}
button{font-family:var(--fb);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}

/* resource bar */
#resbar{left:0;top:0;transform-origin:0 0;transform:scale(var(--s));height:56px;display:flex;align-items:center;gap:6px;padding:0 14px 0 74px;border-radius:0 0 8px 0;border-left:0;border-top:0}
#emblem{position:absolute;left:8px;top:4px;width:56px;height:68px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.7))}
.rs{display:flex;align-items:center;gap:7px;min-width:96px;padding:0 8px;border-right:1px solid #243247;height:40px}
.rs:last-child{border-right:0}
.rs img{width:30px;height:30px}
.rs b{display:block;font-family:var(--fd);font-size:20px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums}
.rs i{display:block;font-style:normal;font-size:13px;line-height:15px;font-variant-numeric:tabular-nums;color:var(--good)}
.rs i.neg{color:var(--bad)}
.rs.low b{color:var(--bad)}
#ageprom{position:absolute;left:0;top:58px;font-size:12px;color:var(--mut)}

/* age + speed */
#agebar{right:0;top:0;transform-origin:100% 0;transform:scale(var(--s));width:268px;padding:8px 12px 10px;border-right:0;border-top:0;border-radius:0 0 0 8px}
#agebar .ag{display:flex;align-items:center;gap:10px}
#agebar .ag img{width:34px;height:34px}
#agebar .an{font-family:var(--fd);font-size:17px;font-weight:600}
#agebar .sn{font-size:13px;color:var(--mut)}
#speed{display:flex;gap:6px;margin-top:8px}
#speed button,.ib{background:#1a2432;border:1px solid #3b4d68;border-radius:3px;height:30px;min-width:36px;padding:0 8px;font-size:14px;font-weight:700}
#speed button.on{background:#304766;border-color:var(--gold)}
#speed button:hover,.ib:hover{background:#26364d}

/* objectives */
#obj{left:0;top:66px;transform-origin:0 0;transform:scale(var(--s));width:232px;padding:10px 14px 12px;border-left:0}
#obj h3{margin:0 0 8px;font-family:var(--fd);font-size:18px;color:var(--gold);font-weight:600}
#obj div{display:flex;align-items:center;gap:9px;margin:5px 0;font-size:15px;color:#d9d3c2}
#obj .bx{width:16px;height:16px;border:2px solid #7d8798;border-radius:2px;flex:none;position:relative}
#obj .done .bx{background:#4a9a3a;border-color:#7ccf62}
#obj .done .bx:after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(40deg)}
#obj .done{color:var(--mut)}

/* bottom deck */
#bottom{position:absolute;left:0;bottom:0;display:flex;align-items:flex-end;gap:6px;transform-origin:0 100%;transform:scale(var(--s));max-width:calc((100% - 226px*var(--s)) / var(--s))}
#deck{position:relative;flex:none;width:578px;border-left:0;border-bottom:0;border-radius:0 8px 0 0;overflow:hidden}
#tabs{display:flex;background:#0d131c;border-bottom:2px solid var(--goldD)}
#tabs button{flex:1;height:42px;background:transparent;border:0;border-right:1px solid #243247;font-family:var(--fd);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;color:#b9c2d1}
#tabs button.on{background:linear-gradient(#27415f,#1a2a40);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
#tabs img{width:24px;height:24px}
#tabbody{padding:8px;height:126px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin;scrollbar-color:#3b4d68 transparent}
.card{-webkit-touch-callout:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;vertical-align:top;width:86px;height:108px;margin-right:5px;padding:4px 2px;
  background:linear-gradient(#1b2535,#111823);border:1px solid #34475f;border-radius:3px;position:relative;text-align:center;cursor:pointer;overflow:hidden}
.card:hover{border-color:var(--gold);background:linear-gradient(#24324a,#16202f)}
.card.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.card.off{opacity:.5;filter:grayscale(.55)}
.card .ic{width:70px;height:56px;display:flex;align-items:center;justify-content:center}
.card .ic img{max-width:70px;max-height:56px;image-rendering:pixelated}
.card .nm{font-size:13px;line-height:14px;font-weight:700;margin-top:1px;white-space:normal;height:28px;display:flex;align-items:center;justify-content:center}
.card .cs{display:flex;gap:4px;justify-content:center;font-size:12px;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.card .cs span{display:inline-flex;align-items:center;gap:2px}
.card .cs img{width:13px;height:13px;image-rendering:pixelated}
.card .cs .no{color:var(--bad)}
.card .bdg{position:absolute;right:3px;top:2px;font-size:11px;background:#000b;border-radius:8px;padding:0 5px;color:var(--gold)}
.card .lock{position:absolute;left:3px;top:2px;font-size:11px;background:#000b;border-radius:8px;padding:0 5px;color:#ff9a8f}
.card .pb{position:absolute;left:3px;right:3px;bottom:3px;height:4px;background:#000;border-radius:2px;overflow:hidden}
.card .pb u{display:block;height:100%;background:var(--gold)}
.card.done{border-color:#4f8f46}
.card.done:after{content:"✓";position:absolute;right:5px;top:2px;color:#7ccf62;font-weight:700}
.btnrow{display:inline-flex;flex-direction:column;gap:5px;vertical-align:top;margin-right:8px;white-space:normal;width:168px}
.btn{background:linear-gradient(#2c4263,#1b2b44);border:1px solid #4a6288;border-radius:3px;padding:6px 10px;font-size:14px;font-weight:700;text-align:left}
.btn:hover{border-color:var(--gold)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.red{background:linear-gradient(#6a2a26,#43191a);border-color:#9b4a44}
.btn.grn{background:linear-gradient(#2c5a2c,#1b3a1d);border-color:#4f8f46}
.note{white-space:normal;font-size:13px;color:var(--mut);max-width:240px;display:inline-block;vertical-align:top}
#train{position:relative;flex:none;width:452px;border-bottom:0;border-radius:6px 6px 0 0}
#train.hide{display:none}
#ucats{display:flex;background:#0d131c;border-bottom:2px solid var(--goldD)}
#ucats button{flex:1;height:28px;background:transparent;border:0;border-right:1px solid #243247;font-size:14px;font-weight:700;color:#b9c2d1}
#ucats button.on{background:linear-gradient(#27415f,#1a2a40);color:#fff;box-shadow:inset 0 -2px 0 var(--gold)}
#ubody{padding:8px;height:138px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
#ubody .card{height:122px}
#ubody .card .ic{height:62px}

/* minimap */
#mini{right:0;bottom:0;transform-origin:100% 100%;transform:scale(var(--s));width:216px;height:216px;padding:8px;border-right:0;border-bottom:0;border-radius:8px 0 0 0;background:#0a0f16}
#mm{width:200px;height:200px;display:block;image-rendering:pixelated;cursor:pointer;border:1px solid #000}
#mini .gl{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:50%;background:#0009;border:1px solid var(--gold);font-size:14px;text-align:center;line-height:24px;cursor:pointer}

/* selection card */
#sel{left:0;bottom:calc(184px * var(--s));transform-origin:0 100%;transform:scale(var(--s));width:330px;padding:10px 12px;border-left:0;border-radius:0 6px 6px 0;white-space:normal}
#sel h4{margin:0;font-family:var(--fd);font-size:19px;font-weight:600;color:var(--gold)}
#sel .sub{font-size:13px;color:var(--mut);margin:2px 0 6px}
.bar{height:9px;background:#05080c;border:1px solid #2a3a50;border-radius:2px;overflow:hidden;margin:4px 0}
.bar u{display:block;height:100%;background:linear-gradient(#8fe070,#3f8f32)}
.bar.q u{background:linear-gradient(#f0cf7a,#a8812c)}
#sel .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#sel .st{font-size:13px;color:#cfd6e2;display:flex;flex-wrap:wrap;gap:2px 12px}
#sel .x{position:absolute;right:6px;top:4px;background:none;border:0;color:var(--mut);font-size:18px}

#toasts{position:absolute;left:50%;top:70px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none!important;z-index:5}
.toast{background:#0b111bee;border:1px solid var(--goldD);border-radius:3px;padding:6px 14px;font-size:15px;font-weight:700;animation:tin .25s ease-out;max-width:80vw;text-align:center}
.toast.war{border-color:var(--bad);color:#ffb5ae}
.toast.good{border-color:#4f8f46;color:#c7f2b8}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#tip{position:absolute;z-index:6;pointer-events:none!important;background:#080c13f2;border:1px solid var(--goldD);border-radius:3px;padding:8px 10px;max-width:260px;font-size:13px;line-height:17px;white-space:normal}
#tip b{font-family:var(--fd);color:var(--gold);font-size:16px;font-weight:600}
#game.touchm #hint{pointer-events:auto!important;padding:9px 16px;border-color:var(--gold)}
#hint{position:absolute;left:50%;bottom:calc(196px * var(--s));transform:translateX(-50%);background:#0b111bdd;border:1px solid var(--goldD);padding:5px 12px;border-radius:3px;font-size:14px;pointer-events:none!important}


/* compact (phone) layout: applied by resize() when the game area is narrower than 700px */
#obj .oc{display:none}
.cmp{--s:1;--dh:166px}
.cmp #resbar{transform:none;left:0;right:0;width:auto;height:40px;padding:0 4px;border-radius:0;border-right:0;overflow-x:auto;scrollbar-width:none}
.cmp #resbar::-webkit-scrollbar{display:none}
.cmp #emblem{display:none}
.cmp #res{flex:1;justify-content:space-between;width:100%}
.cmp .rs{min-width:0;gap:2px;padding:0 3px;height:34px;flex:none}
.cmp .rs img{width:15px;height:15px}
.cmp .rs b{font-size:13px;line-height:15px}
.cmp .rs i{font-size:9px;line-height:11px;white-space:nowrap}
.cmp #agebar{transform:none;right:0;top:40px;width:auto;padding:3px 6px 4px 10px;display:flex;align-items:center;gap:8px;border-radius:0 0 0 8px}
.cmp #agebar .ag img{display:none}
.cmp #agebar .an{font-size:12px;line-height:14px;white-space:nowrap}
.cmp #agebar .sn{font-size:10px;line-height:11px;white-space:nowrap}
.cmp #speed{margin-top:0;gap:3px}
.cmp #speed button,.cmp .ib{height:26px;min-width:28px;padding:0 4px;font-size:12px}
.cmp #obj{transform:none;left:0;top:78px;width:auto;max-width:250px;padding:5px 10px;border-radius:0 6px 6px 0;cursor:pointer}
.cmp #obj h3{margin:0;font-size:13px}
.cmp #obj .oc{display:inline;font-size:11px;color:var(--mut);font-family:var(--fb);font-weight:700;margin-left:4px}
.cmp #obj div{font-size:13px;margin:4px 0}
.cmp #obj:not(.open) div{display:none}
.cmp #obj.open h3{margin-bottom:4px}
.cmp #bottom{transform:none;left:0;right:0;max-width:none;display:block}
.cmp #deck{width:100%;border-radius:0;border-right:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.cmp #tabs button{height:36px;font-size:14px;gap:5px}
.cmp #tabs img{width:18px;height:18px}
.cmp #tabbody{padding:6px;height:94px}
.cmp .card{width:76px;height:92px;margin-right:4px;padding:3px 2px}
.cmp .card .ic{width:60px;height:44px}
.cmp .card .ic img{max-width:60px;max-height:44px}
.cmp .card .nm{font-size:11px;line-height:12px;height:24px}
.cmp .card .cs{font-size:10px;gap:3px}
.cmp .card .cs img{width:11px;height:11px}
.cmp .btnrow{flex-direction:row;flex-wrap:wrap;width:236px;gap:4px;margin-right:6px}
.cmp .btnrow .btn{font-size:12px;padding:5px 8px;flex:1 1 auto}
.cmp .btnrow.pinfo{flex-direction:column;flex-wrap:nowrap;width:170px;gap:1px;font-size:12px!important}
.sep{display:inline-block;width:2px;height:80px;background:#243247;margin:0 7px 0 2px;vertical-align:top}
.cmp #train{display:none}
.cmp #mini{transform:none;right:0;bottom:var(--dh);width:112px;height:112px;padding:5px;border-radius:8px 0 0 8px;border-right:0}
.cmp #mm{width:100px;height:100px}
.cmp #mini .gl{right:8px;top:8px;width:22px;height:22px;line-height:20px;font-size:12px}
.cmp #sel{transform:none;bottom:var(--dh);box-sizing:border-box;width:calc(100% - 120px);max-width:300px;padding:8px 10px}
.cmp #sel h4{font-size:16px}
.cmp #hint{left:8px;transform:none;bottom:calc(var(--dh) + 6px);font-size:13px;max-width:calc(100% - 132px);text-align:center;white-space:normal}
.cmp #toasts{top:112px}
.cmp .toast{font-size:13px;padding:5px 10px}
.cmp .modal{padding:16px 16px}
.cmp .modal h1{font-size:30px}
.cmp .modal h2{font-size:22px}

/* overlay menus */
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#16233acc,#05080dee);z-index:20;padding:16px;box-sizing:border-box}
#ov[hidden]{display:none}
.modal{position:relative;width:min(560px,100%);max-height:100%;overflow:auto;padding:22px 26px;box-sizing:border-box}
.modal h1{margin:0 0 4px;font-family:var(--fd);font-size:40px;color:var(--gold);font-weight:700;text-shadow:0 3px 0 #000}
.modal h2{margin:0 0 10px;font-family:var(--fd);font-size:26px;color:var(--gold)}
.modal p{margin:6px 0;color:#cfd6e2;line-height:1.35}
.modal .menu{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.modal .btn{font-size:17px;padding:9px 14px}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;padding:6px;background:#1a2432;border:1px solid #3b4d68;border-radius:3px;font-weight:700}
.seg button.on{background:#304766;border-color:var(--gold)}
.lbl{font-size:13px;color:var(--mut);margin-top:10px}
.prog{height:14px;border:1px solid var(--goldD);background:#05080c;margin-top:12px;border-radius:2px;overflow:hidden}
.prog u{display:block;height:100%;width:0;background:linear-gradient(#f0cf7a,#a8812c)}
.dip{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #243247;flex-wrap:wrap}
.dip .fl{width:22px;height:28px;border-radius:2px 2px 10px 10px;border:1px solid #000}
.dip .in{flex:1;min-width:150px}
.dip .in b{font-family:var(--fd);font-size:17px}
.dip .in small{display:block;color:var(--mut)}
.dip .ac{display:flex;gap:5px;flex-wrap:wrap}
.dip .btn{padding:4px 8px;font-size:13px}
textarea{width:100%;height:70px;background:#06090e;color:var(--ink);border:1px solid #3b4d68;box-sizing:border-box;font-size:11px}
@media (max-width:1000px){#train{display:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="resbar" class="panel"><canvas id="emblem" width="28" height="34" class="px"></canvas><div id="res" style="display:flex"></div></div>
    <div id="agebar" class="panel">
      <div class="ag"><img id="agecrown" class="px" alt=""><div><div class="an" id="agename"></div><div class="sn" id="seasonname"></div></div></div>
      <div id="speed"><button data-sp="0" title="Pause (Space)">❚❚</button><button data-sp="1" class="on">▶</button><button data-sp="2">▶▶</button><button data-sp="4">▶▶▶</button><button id="gear" class="ib" style="margin-left:auto" title="Menu">⚙</button></div>
    </div>
    <div id="obj" class="panel"></div>

    <div id="tip" hidden></div>
  </div>

</div>
<script>
'use strict';
/* ================= CORE: constants, utils, data ================= */
const MW=96, MH=96, TW=32, TH=16, UN=16;           // map size (tiles), tile pixels, world units per tile
const NK=4, BAND=4, NEUT=5;                        // 4 kingdoms, bandits=4, neutral owner=5
const RES=['gold','wood','food','stone','iron'];
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>(ax-bx)*(ax-bx)+(ay-by)*(ay-by);
const mr=(a,b)=>a+Math.random()*(b-a);
const mri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
// deterministic RNG for map / sprite generation
let _rs=1;
function srand(s){_rs=(s>>>0)||1}
function rand(){_rs^=_rs<<13;_rs>>>=0;_rs^=_rs>>>17;_rs^=_rs<<5;_rs>>>=0;return _rs/4294967296}
function ri(a,b){return Math.floor(a+rand()*(b-a+1))}
function hsh(a,b,c){let h=(a|0)*374761393+(b|0)*668265263+(c|0)*2147483647;h=(h^(h>>>13))*1274126177;h=(h^(h>>>16))>>>0;return h/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hsh(xi,yi,s),b=hsh(xi+1,yi,s),c=hsh(xi,yi+1,s),d=hsh(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o){let a=.5,f=1,r=0,n=0;for(let i=0;i<(o||4);i++){r+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2}return r/n}
const fmt=n=>Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');

/* ---------- language ---------- */
let LANG='ru';
const L=a=>a[LANG==='ru'?0:1];
const nm=o=>L(o.n);
const I18={
 build:['Build','Build'],units:['Units','Units'],research:['Research','Research'],other:['Other','Other'],
 obj:['Задания','Objectives'],o1:['Развивайте королевство','Grow your kingdom'],o2:['Постройте замок','Build a Castle'],o3:['Достигните 100 жителей','Reach 100 population'],o4:['Победите все королевства','Defeat all rival kingdoms'],
 inf:['Пехота','Infantry'],rng:['Стрелки','Ranged'],cav:['Конница','Cavalry'],siege:['Осада','Siege'],

const LD=(()=>{const x=-.3,y=.45,z=.84,l=Math.hypot(x,y,z);return[x/l,y/l,z/l]})();
function scn(){return{p:[],lights:[]}}
function addP(S,pr){pr.id=S.p.length;pr.o=pr.o||{};S.p.push(pr);return pr}
function box(S,x0,y0,z0,x1,y1,z1,mat,c,o){return addP(S,{k:0,pl:[[1,0,0,x1],[-1,0,0,-x0],[0,1,0,y1],[0,-1,0,-y0],[0,0,1,z1],[0,0,-1,-z0]],bb:[x0,y0,z0,x1,y1,z1],mat,c:c||[180,180,180],o})}
function rbox(S,yaw,cx,cy,x0,y0,z0,x1,y1,z1,mat,c,o){
  const co=Math.cos(yaw),si=Math.sin(yaw);
  const base=[[1,0,0,x1],[-1,0,0,-x0],[0,1,0,y1],[0,-1,0,-y0],[0,0,1,z1],[0,0,-1,-z0]];
  const pl=base.map(q=>{const nx=q[0]*co-q[1]*si,ny=q[0]*si+q[1]*co;return[nx,ny,q[2],q[3]-(q[0]*cx+q[1]*cy)+(nx*cx+ny*cy)]});
  let a=1e9,b=1e9,c1=-1e9,d=-1e9;
  for(const x of[x0,x1])for(const y of[y0,y1]){const dx=x-cx,dy=y-cy,X=cx+dx*co-dy*si,Y=cy+dx*si+dy*co;a=Math.min(a,X);c1=Math.max(c1,X);b=Math.min(b,Y);d=Math.max(d,Y)}
  return addP(S,{k:0,pl,bb:[a,b,z0,c1,d,z1],mat,c:c||[180,180,180],o})}
// gable roof; ax='x' ridge along x. (a0,a1)=extent along ridge, (b0,b1)=across. h = rise

/* ---------- territory ---------- */

/* ---------- AI ---------- */
function aiAfford(K,type){const d=BD[type];return K.age>=d.age&&costOK(K.res,d.cost)}
function aiBuild(K,type){
  const k=K.id,keep=K.keepRef&&!K.keepRef.dead?K.keepRef:G.bl.find(b=>!b.dead&&b.owner===k&&BD[b.type].hq);if(!keep)return false;

    if(bd===1e9){const a=Math.random()*6.28;tx=cx+Math.cos(a)*20;ty=cy+Math.sin(a)*20}
    const dx=tx-cx,dy=ty-cy,dl=Math.hypot(dx,dy)||1;const r=type==='castle'?12:9+Math.random()*4;
    spot=findSpot(type,cx+dx/dl*r+(Math.random()-.5)*8,cy+dy/dl*r+(Math.random()-.5)*8,0,6,k,type==='castle'?2:0)}
  else{spot=findSpot(type,cx+(Math.random()-.5)*6,cy+(Math.random()-.5)*6,3,14,k,1)}
  if(!spot)return false;costPay(K.res,d.cost);const b=placeBuilding(k,type,spot[0],spot[1],false);return !!b}
const AI_TRAIN={barracks:[['militia',3,0],['spearman',3,0],['swordsman',3,1],['shieldman',2,1]],archery:[['archer',4,1],['crossbow',3,2]],stable:[['cavalry',3,1],['knight',3,2]],workshop:[['catapult',1,1],['trebuchet',1,2],['siegetower',1,1]]};

function aiTick(K,dt){

      if(c('barracks')<2+(tm>14?1:0))want.push('barracks');if(c('workshop')<1&&tm>5)want.push('workshop')}

  // upgrades
  if(Math.random()<.35){const ups=G.bl.filter(b=>!b.dead&&b.owner===k&&b.built&&!b.up&&b.lv<(K.age>=2?2:K.age>=1?1:0)&&!['wall','bridge','gate','village','fort','camp'].includes(b.type));
    if(ups.length){const b=pick(ups);const cost=upCost(b.type,b.lv+1);if(costOK(K.res,cost)&&K.res.gold>400*(b.lv+1)){costPay(K.res,cost);b.up={t:0,T:16+b.lv*16+BD[b.type].w*BD[b.type].h*1.4}}}}
  // training
  for(const b of G.bl){if(b.dead||b.owner!==k||!b.built||b.q.length>=2)continue;const tab=AI_TRAIN[b.type];if(!tab)continue;
    const opts=tab.filter(o=>K.age>=o[2]);if(!opts.length)continue;let tot=0;for(const o of opts)tot+=o[1];let r=Math.random()*tot,ch=opts[0];for(const o of opts){r-=o[1];if(r<=0){ch=o;break}}
    // keep some reserves for buildings early on

    const kx=K.keepRef.x+2,ky=K.keepRef.y+2;const dx=tx-kx,dy=ty-ky,dl=Math.hypot(dx,dy)||1;const rp=nearestFree(kx+dx/dl*8,ky+dy/dl*8,k,6);
    if(rp)for(const b of G.bl)if(!b.dead&&b.owner===k&&BD[b.type].train&&b.type!=='keep')b.rally=rp}
  aiMilitary(K,tm);
  aiCosmetic(K)}
function aiCosmetic(K){const want=Math.min(14,Math.floor(K.peas*.8));const mine=G.un.filter(u=>!u.dead&&u.owner===K.id&&u.cos);
  if(mine.length<want&&K.keepRef&&!K.keepRef.dead){const p=freeAround(K.keepRef,mine.length);const u=spawnUnit('peasant',K.id,p[0]+.5,p[1]+.5,true);u.idleT=Math.random()}

function aiMilitary(K,tm){
  const k=K.id;const army=G.un.filter(u=>!u.dead&&u.owner===k&&!u.cos&&UD[u.type].cat!=='civ');

  if(!own.length)return;
